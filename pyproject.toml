[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-trace-tara-kb"
version = "1.7.6"
description = "Evidence-assisted ISO/SAE 21434 TARA analysis for connected-car remote vehicle functions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Suyeon Jeon" }
]
keywords = [
  "automotive-security",
  "connected-car",
  "ISO-SAE-21434",
  "TARA",
  "threat-modeling"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security"
]
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1"]

[project.urls]
Homepage = "https://github.com/0xsuyeon/cc-trace"
Repository = "https://github.com/0xsuyeon/cc-trace"
Issues = "https://github.com/0xsuyeon/cc-trace/issues"

[project.scripts]
cc-trace = "cc_trace_kb.cli:main"
cc-trace-kb = "cc_trace_kb.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["cc_trace_kb*"]
namespaces = false

[tool.setuptools.package-data]
cc_trace_kb = ["knowledge/**/*.json", "knowledge/**/*.sha256"]
